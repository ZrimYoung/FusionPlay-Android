name: Build Android port fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/miplay-port-conflict

permissions:
  contents: read

concurrency:
  group: android-portfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci/cargo
      RUSTUP_TOOLCHAIN: stable
      ORG_GRADLE_PROJECT_fusionPlayApplicationId: com.fusionplay.android.portfix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-command-tools.zip"
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $RUNNER_TEMP/android-command-tools.zip" | sha1sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-command-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Flutter 3.32.8
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.32.8-stable.tar.xz \
            --output "$RUNNER_TEMP/flutter.tar.xz"
          echo "c2c7d75f9be53f10f3fdba2f7e042b2ef0852cc088392b374bcec34c6204ed8c  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config cmake
          rustup toolchain install stable --profile minimal
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --version 4.1.2 --locked
          printf 'y\n%.0s' {1..100} | sdkmanager --licenses > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;34.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Test MiPlay SDK
        run: cargo test --locked --manifest-path src/FusionPlay.MiPlaySdk/Cargo.toml

      - name: Check Flutter
        working-directory: flutter
        run: |
          flutter --no-version-check config --no-analytics
          flutter --no-version-check pub get --enforce-lockfile
          flutter --no-version-check analyze --no-pub
          flutter --no-version-check test --no-pub

      # Device testing on 32-bit TVs uses precompiled Dart. The debug build
      # exhibited an input-dispatch ANR during Flutter semantics updates.
      - name: Build TV focus APK
        working-directory: flutter
        run: |
          flutter --no-version-check build apk --profile --no-pub \
            --build-name=1.2.4-tvfocus2 --build-number=10216 \
            --dart-define=FUSIONPLAY_VERSION=1.2.4-tvfocus2

      - name: Test Kotlin backend
        working-directory: flutter/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionPlay-1.2.4-tvfocus2-profile
          path: flutter/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-portfix-test-results
          path: flutter/build/app/reports/tests/
          if-no-files-found: ignore
          retention-days: 30
